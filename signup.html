<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign Up | The Art Room</title><link rel="stylesheet" href="style.css"><script defer src="app.js"></script></head><body><nav class="nav"><a class="brand" href="gallery.html">the art<span>room.</span></a><div class="navlinks"><a href="gallery.html">Explore gallery</a><a href="index.html">Sign in</a></div></nav><main class="auth-shell"><section class="auth-art"><div><div class="eyebrow" style="color:#f3c7b8">Start your collection</div><h2>Every masterpiece has a story.</h2></div></section><section class="auth-panel"><form class="auth-form" id="auth-form" data-mode="signup"><div class="eyebrow">Join the gallery</div><h1>Create account</h1><p>Make a little room in your day for art, artists and ideas.</p><div class="field"><label for="name">Full name</label><input id="name" type="text" placeholder="Your name" required></div><div class="field"><label for="email">Email address</label><input id="email" type="email" placeholder="you@example.com" required></div><div class="field"><label for="password">Create password</label><input id="password" type="password" minlength="6" placeholder="At least 6 characters" required></div><button type="submit">Create account</button><p id="form-message" class="notice" aria-live="polite"></p><div class="auth-switch">Already have an account? <a href="index.html">Sign in</a></div><p class="notice">Demo only: details stay in this browser and are not sent to a server.</p></form></section></main></body></html>
